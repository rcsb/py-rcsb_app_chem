name: Run CI/CD Workflow

on:
  push:
    paths-ignore:
      - "k8s/**"
  # Weekly rebuild so the image picks up base-image / OS security updates even
  # when no application code has changed. Scheduled runs are tagged "staging"
  # only (see do_staging_build / do_production_build below); "production" is
  # promoted only by a real code push to master.
  schedule:
    - cron: "0 12 * * 0"  # Sundays 12:00 UTC
  workflow_dispatch:

jobs:
  run-workflow:
    name: "Run automated workflow"
    uses: rcsb/devops-cicd-github-actions/.github/workflows/workflow-docker.yaml@master
    with:
      dockerfile_location: "Dockerfile"
      repo_url: "harbor.devops.k8s.rcsb.org"
      repo_project: "rcsb"
      docker_image_name: "rcsb-chemsearch"
      docker_build_context: "."
      # Scheduled (weekly) rebuilds re-tag as "staging" only; pushes keep the
      # previous behavior of re-tagging as "production". Both re-tag jobs in the
      # called workflow additionally require ref_name == master.
      do_staging_build: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      do_production_build: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
