{{- range tuple "a" "b" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm_chart.fullname" $ }}-{{ . }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}
    rcsb.org/path: {{ . | quote }}
spec:
  replicas: {{ $.Values.replicaCount }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit}}
  selector:
    matchLabels:
      {{- include "helm_chart.selectorLabels" $ | nindent 6 }}
      rcsb.org/path: {{ . | quote }}
  strategy:
    type: {{ $.Values.deploymentStrategy.type }}
    {{- if eq $.Values.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ $.Values.deploymentStrategy.maxSurge }}
      maxUnavailable: {{ $.Values.deploymentStrategy.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "helm_chart.selectorLabels" $ | nindent 8 }}
        rcsb.org/path: {{ . | quote }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "helm_chart.selectorLabels" $ | nindent 20 }}
                topologyKey: kubernetes.io/hostname
              weight: 1
      imagePullSecrets:
        - name: {{ $.Values.imagePullSecrets }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $.Chart.Name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ## A lifecycle preStop hook is added to allow pods to gracefully handle existing requests before termination, helping prevent 5XX errors caused by abrupt pod termination.
          lifecycle:             
            preStop:
              exec:
                command: ["sleep", "6"]
          args: 
            {{- toYaml $.Values.arguments | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: {{ $.Values.service.containerPort }}
              protocol: TCP
          livenessProbe:
            initialDelaySeconds: {{ $.Values.livenessProbe.initialDelaySeconds }}
            failureThreshold: {{ $.Values.livenessProbe.failureThreshold }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            httpGet:
              path: {{ $.Values.livenessProbe.http.path }}
              port: {{ $.Values.service.containerPort }}
          readinessProbe:
            initialDelaySeconds: {{ $.Values.readinessProbe.initialDelaySeconds }}
            failureThreshold: {{ $.Values.readinessProbe.failureThreshold }}
            periodSeconds: {{ $.Values.readinessProbe.periodSeconds }}
            httpGet:
              path: {{ $.Values.readinessProbe.http.path }}
              port: {{ $.Values.service.containerPort }}
          env:
            {{- toYaml $.Values.podEnvVars | nindent 12 }}
            - name: CHEM_SEARCH_UPDATE_CHANNEL
              value: {{ . }}
            {{- $path := . }}
            {{- with $.Values.chemSearchStash }}
            {{- if .url }}
            - name: CHEM_SEARCH_STASH_URL
              value: {{ .url | quote }}
            - name: CHEM_SEARCH_STASH_PATH
              value: {{ required (printf "chemSearchStash.path.%s is required" $path) (index .path $path) | quote }}
            - name: AWS_ENDPOINT_URL
              value: {{ required "chemSearchStash.endpointUrl is required" .endpointUrl | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "chemSearchStash.credentialsSecret is required" .credentialsSecret }}
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecret }}
                  key: secret-key
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - name: appfs   # Required for app to write to /app but enforce readonly root file system.
              mountPath: /app/CACHE
            - name: tmpfs   # Required for app to write to /tmp but enforce readonly root file system.
              mountPath: /tmp
            {{- if $.Values.useSecretsVolume }}
            - name: {{ include "helm_chart.fullname" $ }}-secret
              mountPath: "{{ $.Values.secretVolumes.mountPath }}"
              readOnly: true
            {{- end }}
      volumes:
        - name: tmpfs
          emptyDir:
            medium: Memory
        - name: appfs
          emptyDir:
            medium: Memory
        {{- if $.Values.useSecretsVolume }}
        - name: {{ include "helm_chart.fullname" $ }}-secret
          secret:
            secretName: {{ $.Values.secretVolumes.secretName }}
        {{- end }}
{{- end }}
