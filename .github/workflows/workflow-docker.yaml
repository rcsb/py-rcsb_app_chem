name: Run CI/CD Workflow

on:
  # Run when pushed to any branch
  push:
    paths-ignore:
      - "k8s/**"
  workflow_dispatch:
  #
  # Rebuild monthly, so that the image continues to pick up base-image and OS
  # security updates even when no application code has changed.
  schedule:
    # Time is based on UTC timezone
    #  ┌───────────── minute (0 - 59)
    #  │ ┌───────────── hour (0 - 23)
    #  │ │ ┌───────────── day of the month (1 - 31)
    #  │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #  │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #  │ │ │ │ │
    #  * * * * *
    - cron: "0 12 1 * *"  # 12:00 UTC on the first of each month

jobs:
  run-workflow:
    name: "Run automated workflow"
    uses: rcsb/devops-cicd-github-actions/.github/workflows/workflow-docker.yaml@master
    with:
      dockerfile_location: "Dockerfile"
      repo_url: "harbor.devops.k8s.rcsb.org"
      repo_project: "rcsb"
      docker_image_name: "rcsb-chemsearch"
      docker_build_context: "."
